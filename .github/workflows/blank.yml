name: CI/CD – Digital Library

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── JOB 1: TEST ──────────────────────────────────────────
  test:
    name: 🧪 Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Check all required files exist ──
      - name: Check required files exist
        run: |
          echo "Checking required files..."
          files=("index.html" "dashboard.html" "style.css" "library.js")
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing file: $f"
              exit 1
            else
              echo "✅ Found: $f"
            fi
          done

      # ── Validate HTML files ──
      - name: Install HTML validator
        run: npm install -g html-validate

      - name: Validate index.html
        run: html-validate index.html || true        # warn but don't fail on minor issues

      - name: Validate dashboard.html
        run: html-validate dashboard.html || true

      # ── Lint JavaScript ──
      - name: Install ESLint
        run: npm install -g eslint

      - name: Lint library.js
        run: |
          eslint library.js \
            --env browser \
            --env es6 \
            --rule '{"no-undef": "warn", "no-unused-vars": "warn"}' \
            || true                                  # warn but don't fail

      # ── Check CSS is non-empty ──
      - name: Validate style.css is non-empty
        run: |
          size=$(wc -c < style.css)
          echo "style.css size: $size bytes"
          if [ "$size" -lt 10 ]; then
            echo "❌ style.css looks empty!"
            exit 1
          fi
          echo "✅ style.css OK"

      # ── Build Docker image to confirm it builds cleanly ──
      - name: Build Docker image (test)
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      # ── Smoke-test: run container and hit it with curl ──
      - name: Smoke test – container serves index.html
        run: |
          docker run -d --name lib-test -p 8080:80 ${{ env.IMAGE_NAME }}:test
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          echo "HTTP status: $STATUS"
          docker stop lib-test
          docker rm   lib-test
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test failed – got HTTP $STATUS"
            exit 1
          fi
          echo "✅ Smoke test passed"


  # ── JOB 2: BUILD & PUSH (only on push to main/master) ────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                                      # only runs if test job passes
    if: github.event_name == 'push'                  # skip on pull requests

    permissions:
      contents: read
      packages: write                                # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}      # auto-provided by GitHub

      # ── Tag the image with both 'latest' and the commit SHA ──
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: ✅ Done – image pushed
        run: |
          echo "Image pushed to:"
          echo "${{ steps.meta.outputs.tags }}"
